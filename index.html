<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTO Fraud Detection Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F7F8FA;
    --paper-raised:#FFFFFF;
    --raised-2:#EEF1F6;
    --ink:#14171F;
    --ink-soft:#5B6272;
    --ink-faint:#9AA0AF;
    --line:#E1E4EA;
    --blue:#2874F0;
    --blue-tint:#EAF1FE;
    --yellow:#C9791E;
    --critical:#C6362B;
    --critical-bg:#FBE7E5;
    --high:#C9791E;
    --high-bg:#FBEEDC;
    --medium:#A8790A;
    --medium-bg:#F7EDD3;
    --low:#1E8A5F;
    --low-bg:#E1F3EA;
    --neutral:#8B90A0;
    --neutral-bg:#EDEEF2;
    --content-max:1440px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .container{max-width:var(--content-max);margin:0 auto;padding:0 32px;}

  a, button, input, select, .chip, .row, .flag, .upload-btn, .page-btn{
    transition:background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
  }

  header.top{
    padding:30px 0 22px;
    border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
  header.top h1{
    margin:0 0 5px;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header.top p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .stats{
    display:flex;
    align-items:center;
    gap:22px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .stat-total{display:flex;align-items:baseline;gap:8px;}
  .stat-total .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:24px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .stat-total .l{
    color:var(--ink-soft);
    font-size:12.5px;
  }
  .stat-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .stat-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 10px;
    border-radius:3px;
    font-size:12px;
    font-weight:500;
  }
  .stat-chip .n{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .dot{
    width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;
  }

  .upload-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--blue);
    color:#FFFFFF;
    border:none;
    padding:10px 16px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    border-radius:3px;
  }
  .upload-btn:hover{background:#1f5fd1;}
  .upload-btn.secondary{
    background:transparent;
    color:var(--blue);
    border:1px solid var(--blue);
  }
  .upload-btn.secondary:hover{background:var(--blue-tint);}
  input[type=file]{display:none;}
  .upload-group{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .file-status{
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .status-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .status-dot.ok{background:var(--low);}
  .status-dot.warn{background:var(--high);}
  .status-dot.pending{background:var(--neutral);}

  main{max-width:var(--content-max);margin:0 auto;padding:28px 32px 60px;}

  .section-head{margin-bottom:16px;}
  .section-head h2{font-size:15px;font-weight:600;margin:0 0 3px;}
  .section-head p{font-size:12.5px;color:var(--ink-soft);margin:0;}

  .empty{
    text-align:left;
    padding:60px 0;
    max-width:480px;
  }
  .empty h2{font-size:18px;margin:0 0 8px;}
  .empty p{color:var(--ink-soft);margin:0 0 18px;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px 12px;
    align-items:center;
    padding:14px 16px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:3px;
    margin-bottom:16px;
  }
  .toolbar input[type=text]{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:3px;
    min-width:200px;
    color:var(--ink);
  }
  .toolbar select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:3px;
    color:var(--ink);
  }
  .score-range{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
  .score-range input{width:52px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 7px;border:1px solid var(--line);background:var(--paper);border-radius:3px;color:var(--ink);}

  .chip{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    padding:6px 11px;
    font-size:12.5px;
    border-radius:14px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .chip.on-yes{background:var(--blue);color:#FFFFFF;border-color:var(--blue);}
  .chip.on-no{background:transparent;color:var(--neutral);border-color:var(--line);text-decoration:line-through;}

  .reset-link{
    font-size:12.5px;
    color:var(--blue);
    text-decoration:none;
    font-weight:500;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    margin-left:auto;
  }
  .reset-link:hover{text-decoration:underline;}

  .table-wrap{
    overflow:auto;
    max-height:800px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper-raised);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    position:sticky;
    top:0;
    z-index:1;
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--paper-raised);
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
  }
  thead th.sorted{color:var(--ink);}
  thead th .arrow{font-size:10px;margin-left:3px;opacity:0.7;}
  tbody tr.row{
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  tbody tr.row:hover{background:var(--raised-2);}
  tbody tr.row.expanded{background:var(--raised-2);}
  tbody td{
    padding:11px 10px;
    vertical-align:middle;
  }
  td.id{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .chevron{
    display:inline-block;
    width:14px;
    color:var(--ink-faint);
    transition:transform .15s ease;
  }
  tr.row.expanded .chevron{transform:rotate(90deg);color:var(--blue);}
  td.summary-cell{color:var(--ink-soft);font-size:12.5px;max-width:340px;}
  .truncate{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:340px;
  }

  .risk-badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .risk-CRITICAL{background:var(--critical-bg);color:var(--critical);}
  .risk-HIGH{background:var(--high-bg);color:var(--high);}
  .risk-MEDIUM{background:var(--medium-bg);color:var(--medium);}
  .risk-LOW{background:var(--low-bg);color:var(--low);}
  .risk-OTHER{background:var(--neutral-bg);color:var(--neutral);}

  .score-cell{display:flex;align-items:center;gap:8px;}
  .score-num{font-family:'IBM Plex Mono',monospace;font-size:13px;width:26px;text-align:right;}
  .score-bar-bg{width:64px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .score-bar-fill{height:100%;border-radius:3px;}

  .flags{display:flex;gap:4px;}
  .flag{
    width:20px;height:20px;
    border-radius:3px;
    font-size:10px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line);
    color:var(--neutral);
    background:transparent;
  }
  .flag.active{
    background:var(--blue);
    color:#FFFFFF;
    border-color:var(--blue);
  }

  tr.detail-row td{
    background:var(--raised-2);
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .detail-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:14px;
    margin-bottom:12px;
  }
  .detail-item h4{
    margin:0 0 3px;
    font-size:12px;
    font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .detail-item p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .detail-summary{
    border-top:1px solid var(--line);
    padding-top:12px;
    font-size:13px;
  }
  .detail-summary strong{display:block;font-size:12px;margin-bottom:4px;}

  .no-match{
    padding:40px 0;
    color:var(--ink-soft);
    text-align:left;
  }

  .pagination{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 2px 0;
    font-size:12.5px;
    color:var(--ink-soft);
    flex-wrap:wrap;
    gap:10px;
  }
  .pagination-controls{display:flex;align-items:center;gap:12px;}
  .page-btn{
    background:var(--paper-raised);
    border:1px solid var(--line);
    color:var(--ink);
    padding:6px 14px;
    font-size:12.5px;
    font-family:'IBM Plex Sans',sans-serif;
    border-radius:3px;
    cursor:pointer;
  }
  .page-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .page-btn:hover:not(:disabled){background:var(--raised-2);}
  .page-indicator{font-family:'IBM Plex Mono',monospace;font-size:12px;}

  .attempts-badge{
    display:inline-block;
    margin-left:8px;
    font-size:10.5px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    color:var(--blue);
    background:var(--blue-tint);
    padding:2px 7px;
    border-radius:10px;
    vertical-align:middle;
  }
  .attempts-label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .attempt-block{
    padding:10px 0;
  }
  .attempt-block + .attempt-block{
    border-top:1px solid var(--line);
    margin-top:6px;
    padding-top:14px;
  }
  .attempt-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }

  .analytics{margin-top:40px;}
  .chart-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:16px;
  }
  .chart-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 20px 20px;
  }
  .chart-card h3{margin:0 0 14px;font-size:12.5px;font-weight:600;}
  .chart-placeholder p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .chart-legend{display:flex;gap:14px;margin-bottom:14px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .chart-legend-item{display:flex;align-items:center;gap:5px;}
  .chart-row{
    display:grid;
    grid-template-columns:140px 1fr 30px;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:12px;
    padding:2px 4px;
    border-radius:3px;
  }
  .chart-row:hover{background:var(--raised-2);}
  .chart-label{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chart-bar-track{height:14px;border-radius:3px;background:var(--raised-2);overflow:hidden;}
  .chart-bar-fill-wrap{display:flex;height:100%;}
  .chart-bar-seg{height:100%;}
  .chart-total{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-align:right;font-size:11.5px;}
  .chart-empty{font-size:12.5px;color:var(--ink-soft);margin:0;}

  .legend{
    margin-top:6px;
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:0.02em;
  }

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<header class="top">
  <div class="container">
    <div class="top-row">
      <div>
        <h1>RTO Fraud Detection Engine</h1>
        <p class="sub">Protecting seller trust, one verified delivery at a time.</p>
      </div>
      <div style="text-align:right;">
        <div class="upload-group">
          <label class="upload-btn" for="fileInput">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4L7 9M12 4l5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            Upload fraud analysis file
          </label>
          <input type="file" id="fileInput" accept=".xlsx,.xls">
          <label class="upload-btn secondary" for="fileInput2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4L7 9M12 4l5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            Upload call data file
          </label>
          <input type="file" id="fileInput2" accept=".xlsx,.xls">
        </div>
        <div class="file-status" id="joinStatus"></div>
        <div class="legend mono" id="legend"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main id="main">
  <div class="empty" id="emptyState">
    <h2>No file loaded</h2>
    <p>Upload the fraud analysis export to begin the review. Add the call data export to unlock seller type, RTO reason, and geo-distance filters, joined by shipment ID.</p>
  </div>
</main>

<script>
let rawRows = [];
let categories = [];
let filtered = [];
let sortKey = 'Overall Score';
let sortDir = 'desc';
let search = '';
let riskFilter = '';
let catFilterState = {};
let scoreMin = 0, scoreMax = 100;
let expandedRow = null;
let currentPage = 1;
const PAGE_SIZE = 20;
let extraFilters = {seller_type:'', rto_reason:'', geo_distance_bucket:''};
let inputRowsSource = null; // rows from the call-data file, in original order
let inputLoaded = false;

const fileInput = document.getElementById('fileInput');
const fileInput2 = document.getElementById('fileInput2');
const mainEl = document.getElementById('main');
const emptyState = document.getElementById('emptyState');
const statsEl = document.getElementById('stats');
const joinStatusEl = document.getElementById('joinStatus');

function readWorkbook(file, cb){
  const reader = new FileReader();
  reader.onload = (evt) => {
    const data = new Uint8Array(evt.target.result);
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws, {header:1, defval:''}));
  };
  reader.readAsArrayBuffer(file);
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  readWorkbook(file, parseRows);
});

fileInput2.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  readWorkbook(file, parseInputRows);
});

function parseInputRows(rows){
  const headers = rows[0].map(h => String(h).trim().toLowerCase());
  const idx = {
    shipmentid: headers.indexOf('shipmentid'),
    seller_type: headers.indexOf('seller_type'),
    rto_reason: headers.indexOf('rto_reason'),
    geo_distance_bucket: headers.indexOf('geo_distance_bucket')
  };
  if (idx.shipmentid === -1){
    joinStatusEl.textContent = 'Could not find a "shipmentid" column in that file — join skipped.';
    return;
  }
  const dataRows = rows.slice(1).filter(r => r.some(c => c !== ''));
  inputRowsSource = dataRows.map(r => ({
    shipmentid: r[idx.shipmentid],
    seller_type: idx.seller_type > -1 ? r[idx.seller_type] : null,
    rto_reason: idx.rto_reason > -1 ? r[idx.rto_reason] : null,
    geo_distance_bucket: idx.geo_distance_bucket > -1 ? r[idx.geo_distance_bucket] : null
  }));
  inputLoaded = true;
  attachExtraFields();
  render();
}

function attachExtraFields(){
  rawRows.forEach(r => { r.seller_type = null; r.rto_reason = null; r.geo_distance_bucket = null; });
  if (!rawRows.length) return;
  if (!inputLoaded || !inputRowsSource){ updateJoinStatus(0); return; }

  // group input rows by shipment id, preserving order, so repeat
  // shipment ids join to the corresponding occurrence in the fraud file
  const queues = {};
  inputRowsSource.forEach(ir => {
    const key = String(ir.shipmentid).trim().toLowerCase();
    (queues[key] = queues[key] || []).push(ir);
  });
  let matched = 0;
  rawRows.forEach(r => {
    const key = String(r['Shipment ID']).trim().toLowerCase();
    const q = queues[key];
    if (q && q.length){
      const m = q.shift();
      r.seller_type = m.seller_type || null;
      r.rto_reason = m.rto_reason || null;
      r.geo_distance_bucket = m.geo_distance_bucket || null;
      matched++;
    }
  });
  updateJoinStatus(matched);
}

function updateJoinStatus(matched){
  if (!inputLoaded){ joinStatusEl.innerHTML = ''; return; }
  if (!rawRows.length){ joinStatusEl.innerHTML = '<span class="status-dot pending"></span>Call data loaded — upload the fraud analysis file to join it.'; return; }
  const allMatched = matched === rawRows.length;
  const dotClass = allMatched ? 'ok' : 'warn';
  const msg = allMatched
    ? `Call data joined — matched all ${matched} rows.`
    : `Call data joined — matched ${matched} of ${rawRows.length} rows by shipment ID.`;
  joinStatusEl.innerHTML = `<span class="status-dot ${dotClass}"></span>${msg}`;
}

function parseRows(rows){
  const headers = rows[0].map(h => String(h).trim());
  const dataRows = rows.slice(1).filter(r => r.some(c => c !== ''));

  // detect category groups: any header ending in " Confidence"
  categories = [];
  headers.forEach(h => {
    if (h.endsWith(' Confidence')){
      const base = h.slice(0, -(' Confidence'.length));
      const flagIdx = headers.indexOf(base);
      const evidenceIdx = headers.indexOf(base + ' Evidence');
      categories.push({
        name: base,
        flagCol: flagIdx > -1 ? base : null,
        confCol: h,
        evCol: evidenceIdx > -1 ? base + ' Evidence' : null
      });
    }
  });

  rawRows = dataRows.map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] !== undefined ? r[i] : '');
    // derive per-category flag boolean
    obj.__flags = {};
    categories.forEach(c => {
      let isYes;
      if (c.flagCol) {
        isYes = String(obj[c.flagCol]).trim().toUpperCase() === 'YES';
      } else {
        isYes = Number(obj[c.confCol]) > 0;
      }
      obj.__flags[c.name] = isYes;
    });
    obj.__score = Number(obj['Overall Score']) || 0;
    obj.__risk = (obj['Overall Risk'] || 'OTHER').toString().toUpperCase();
    return obj;
  });

  catFilterState = {};
  categories.forEach(c => catFilterState[c.name] = 'any'); // any | yes | no
  riskFilter = '';
  search = '';
  extraFilters = {seller_type:'', rto_reason:'', geo_distance_bucket:''};
  scoreMin = 0;
  scoreMax = 100;
  currentPage = 1;

  emptyState.style.display = 'none';
  attachExtraFields();
  render();
}

function riskClass(risk){
  if (['CRITICAL','HIGH','MEDIUM','LOW'].includes(risk)) return 'risk-' + risk;
  return 'risk-OTHER';
}
function riskColor(risk){
  return {CRITICAL:'var(--critical)',HIGH:'var(--high)',MEDIUM:'var(--medium)',LOW:'var(--low)'}[risk] || 'var(--neutral)';
}
function riskRank(risk){
  return {CRITICAL:4,HIGH:3,MEDIUM:2,LOW:1}[risk] || 0;
}

// group individual call attempts by shipment id; the "best" attempt
// (highest risk category, score breaks ties) represents the shipment
// until the group is expanded to show every attempt
function buildGroups(rows){
  const map = {};
  const order = [];
  rows.forEach(r => {
    const key = r['Shipment ID'];
    if (!map[key]){ map[key] = []; order.push(key); }
    map[key].push(r);
  });
  return order.map(key => {
    const attempts = map[key];
    let best = attempts[0];
    attempts.forEach(a => {
      const rd = riskRank(a.__risk) - riskRank(best.__risk);
      if (rd > 0 || (rd === 0 && a.__score > best.__score)) best = a;
    });
    const flagsAgg = {};
    categories.forEach(c => { flagsAgg[c.name] = attempts.some(a => a.__flags[c.name]); });
    return { id: key, attempts, best, flagsAgg };
  });
}

function rowPassesFilters(r){
  if (riskFilter && r.__risk !== riskFilter) return false;
  if (extraFilters.seller_type && r.seller_type !== extraFilters.seller_type) return false;
  if (extraFilters.rto_reason && r.rto_reason !== extraFilters.rto_reason) return false;
  if (extraFilters.geo_distance_bucket && r.geo_distance_bucket !== extraFilters.geo_distance_bucket) return false;
  if (r.__score < scoreMin || r.__score > scoreMax) return false;
  for (const c of categories){
    const state = catFilterState[c.name];
    if (state === 'yes' && !r.__flags[c.name]) return false;
    if (state === 'no' && r.__flags[c.name]) return false;
  }
  if (search){
    const hay = ((r['Shipment ID']||'') + ' ' + (r['Summary']||'')).toLowerCase();
    if (!hay.includes(search.toLowerCase())) return false;
  }
  return true;
}

function applyFilters(){
  const groups = buildGroups(rawRows);
  // a shipment stays in view if any of its attempts satisfies the filters
  filtered = groups.filter(g => g.attempts.some(rowPassesFilters));
  filtered.sort((a,b) => {
    let av, bv;
    if (sortKey === 'Overall Score'){ av = a.best.__score; bv = b.best.__score; }
    else if (sortKey === 'Overall Risk'){ av = riskRank(a.best.__risk); bv = riskRank(b.best.__risk); }
    else { av = a.best[sortKey]; bv = b.best[sortKey]; }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

const RISK_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','OTHER'];

function buildBucketBreakdown(groups, getKey){
  const map = {};
  groups.forEach(g => {
    const key = getKey(g);
    if (!key) return;
    const risk = g.best.__risk;
    if (!map[key]) map[key] = {};
    map[key][risk] = (map[key][risk] || 0) + 1;
  });
  const rows = Object.keys(map).map(key => {
    const counts = map[key];
    const total = Object.values(counts).reduce((a,b) => a+b, 0);
    return { label: key, counts, total };
  });
  rows.sort((a,b) => b.total - a.total);
  return rows;
}

function buildFlagFrequency(groups){
  return categories.map((c,i) => ({
    label: `${i+1} ${c.name}`,
    count: groups.filter(g => g.flagsAgg[c.name]).length
  }));
}

function renderStackedRows(rows){
  if (!rows.length) return `<p class="chart-empty">No data for the current filters.</p>`;
  const max = Math.max(...rows.map(r => r.total), 1);
  return rows.map(r => {
    const widthPct = (r.total / max * 100);
    const segs = RISK_ORDER.filter(risk => r.counts[risk]).map(risk => {
      const segPct = (r.counts[risk] / r.total * 100);
      return `<div class="chart-bar-seg" style="width:${segPct}%;background:${riskColor(risk)}"></div>`;
    }).join('');
    return `<div class="chart-row">
      <span class="chart-label" title="${r.label}">${r.label}</span>
      <div class="chart-bar-track"><div class="chart-bar-fill-wrap" style="width:${widthPct}%;">${segs}</div></div>
      <span class="chart-total">${r.total}</span>
    </div>`;
  }).join('');
}

function renderSingleRows(rows){
  if (!rows.length) return `<p class="chart-empty">No data for the current filters.</p>`;
  const max = Math.max(...rows.map(r => r.count), 1);
  return rows.map(r => {
    const pct = (r.count / max * 100);
    return `<div class="chart-row">
      <span class="chart-label" title="${r.label}">${r.label}</span>
      <div class="chart-bar-track"><div class="chart-bar-seg" style="width:${pct}%;height:100%;background:var(--blue);"></div></div>
      <span class="chart-total">${r.count}</span>
    </div>`;
  }).join('');
}

function riskLegendHtml(presentRisks){
  return presentRisks.map(risk => `<span class="chart-legend-item"><span class="dot" style="background:${riskColor(risk)}"></span>${risk.toLowerCase()}</span>`).join('');
}

function renderAnalyticsSection(){
  const flagRows = buildFlagFrequency(filtered);
  const flagChart = `<div class="chart-card">
    <h3>Flag frequency across shipments</h3>
    ${renderSingleRows(flagRows)}
  </div>`;

  let geoChart, rtoChart;
  if (inputLoaded){
    const geoRows = buildBucketBreakdown(filtered, g => g.best.geo_distance_bucket);
    const rtoRows = buildBucketBreakdown(filtered, g => g.best.rto_reason);
    const presentRisks = RISK_ORDER.filter(risk => geoRows.some(r => r.counts[risk]) || rtoRows.some(r => r.counts[risk]));
    const legend = `<div class="chart-legend">${riskLegendHtml(presentRisks)}</div>`;
    geoChart = `<div class="chart-card">
      <h3>Risk level &times; Geo distance</h3>
      ${legend}
      ${renderStackedRows(geoRows)}
    </div>`;
    rtoChart = `<div class="chart-card">
      <h3>Risk level &times; RTO reason</h3>
      ${legend}
      ${renderStackedRows(rtoRows)}
    </div>`;
  } else {
    geoChart = `<div class="chart-card chart-placeholder">
      <h3>Risk level &times; Geo distance</h3>
      <p>Upload the call data file to unlock this breakdown.</p>
    </div>`;
    rtoChart = `<div class="chart-card chart-placeholder">
      <h3>Risk level &times; RTO reason</h3>
      <p>Upload the call data file to unlock this breakdown.</p>
    </div>`;
  }

  return `<section class="analytics">
    <div class="section-head">
      <h2>Analytics</h2>
      <p>Reflects the shipments currently matching your filters.</p>
    </div>
    <div class="chart-grid">
      ${flagChart}
      ${geoChart}
      ${rtoChart}
    </div>
  </section>`;
}

function renderLegend(){
  const legendEl = document.getElementById('legend');
  if (!categories.length){ legendEl.textContent = ''; return; }
  legendEl.textContent = categories.map((c, i) => `${i+1}-${c.name.charAt(0)}`).join('  ');
}

function renderStats(){
  const groups = buildGroups(rawRows);
  const total = groups.length;
  const byRisk = {};
  groups.forEach(g => byRisk[g.best.__risk] = (byRisk[g.best.__risk]||0) + 1);
  let html = `<div class="stat-total"><span class="n">${total}</span><span class="l">shipments loaded</span></div>`;
  const riskKeys = Object.keys(byRisk).sort((a,b) => riskRank(b)-riskRank(a));
  if (riskKeys.length){
    html += `<div class="stat-chips">`;
    riskKeys.forEach(risk => {
      html += `<span class="stat-chip ${riskClass(risk)}"><span class="n">${byRisk[risk]}</span>${risk.toLowerCase()}</span>`;
    });
    html += `</div>`;
  }
  statsEl.innerHTML = total ? html : '';
}

function render(){
  renderStats();
  renderLegend();
  applyFilters();

  const riskOptions = [...new Set(rawRows.map(r => r.__risk))];

  let toolbarHtml = `
    <div class="section-head">
      <h2>Shipments</h2>
      <p>One row per shipment, ranked by risk. Click a row to see every call attempt.</p>
    </div>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search shipment ID or summary" value="${search}">
      <select id="riskSelect">
        <option value="">All risk levels</option>
        ${riskOptions.map(r => `<option value="${r}" ${riskFilter===r?'selected':''}>${r}</option>`).join('')}
      </select>
      ${inputLoaded ? `
      <select id="sellerTypeSelect">
        <option value="">All seller types</option>
        ${[...new Set(rawRows.map(r=>r.seller_type).filter(Boolean))].map(v => `<option value="${v}" ${extraFilters.seller_type===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <select id="rtoReasonSelect">
        <option value="">All RTO reasons</option>
        ${[...new Set(rawRows.map(r=>r.rto_reason).filter(Boolean))].map(v => `<option value="${v}" ${extraFilters.rto_reason===v?'selected':''}>${v}</option>`).join('')}
      </select>
      <select id="geoSelect">
        <option value="">All geo distances</option>
        ${[...new Set(rawRows.map(r=>r.geo_distance_bucket).filter(Boolean))].map(v => `<option value="${v}" ${extraFilters.geo_distance_bucket===v?'selected':''}>${v}</option>`).join('')}
      </select>
      ` : ''}
      <div class="score-range">
        score <input type="number" id="scoreMinInput" value="${scoreMin}" min="0" max="100"> to
        <input type="number" id="scoreMaxInput" value="${scoreMax}" min="0" max="100">
      </div>
      ${categories.map((c, i) => {
        const state = catFilterState[c.name];
        const cls = state === 'yes' ? 'on-yes' : (state === 'no' ? 'on-no' : '');
        const label = `${i+1} ${c.name}` + (state === 'no' ? ' (no)' : '');
        return `<button class="chip ${cls}" data-cat="${c.name}">${label}</button>`;
      }).join('')}
      <button class="reset-link" id="resetBtn">Reset filters</button>
    </div>
  `;

  const cols = [
    {key:'Shipment ID', label:'Shipment ID'},
    {key:'Overall Risk', label:'Risk'},
    {key:'Overall Score', label:'Score'},
  ];
  if (inputLoaded){
    cols.push({key:'seller_type', label:'Seller type'});
    cols.push({key:'rto_reason', label:'RTO reason'});
    cols.push({key:'geo_distance_bucket', label:'Geo distance'});
  }

  let tableHtml = `<div class="table-wrap"><table><thead><tr>
    ${cols.map(c => `<th data-key="${c.key}" class="${sortKey===c.key?'sorted':''}">${c.label}${sortKey===c.key ? `<span class="arrow">${sortDir==='asc'?'\u25B2':'\u25BC'}</span>` : ''}</th>`).join('')}
    <th title="Flagged in any call attempt for this shipment">Flags</th>
    <th>Summary</th>
  </tr></thead><tbody>`;

  const totalItems = filtered.length;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(pageStart, pageStart + PAGE_SIZE);

  if (filtered.length === 0){
    tableHtml += `<tr><td colspan="${cols.length+2}"><div class="no-match">No shipments match these filters.</div></td></tr>`;
  } else {
    pageItems.forEach((g, i) => {
      const idx = pageStart + i;
      const r = g.best;
      const risk = r.__risk;
      const extraTds = inputLoaded ? `
        <td class="mono" style="font-size:12.5px;">${r.seller_type || '\u2014'}</td>
        <td style="font-size:12.5px;">${r.rto_reason || '\u2014'}</td>
        <td class="mono" style="font-size:12.5px;">${r.geo_distance_bucket || '\u2014'}</td>
      ` : '';
      tableHtml += `<tr class="row${expandedRow === idx ? ' expanded' : ''}" data-idx="${idx}">
        <td class="id"><span class="chevron">\u203a</span>${g.id}${g.attempts.length > 1 ? `<span class="attempts-badge">${g.attempts.length} attempts</span>` : ''}</td>
        <td><span class="risk-badge ${riskClass(risk)}">${risk}</span></td>
        <td>
          <div class="score-cell">
            <span class="score-num">${r.__score}</span>
            <span class="score-bar-bg"><span class="score-bar-fill" style="width:${r.__score}%;background:${riskColor(risk)}"></span></span>
          </div>
        </td>
        ${extraTds}
        <td>
          <div class="flags">
            ${categories.map((c, i) => `<span class="flag ${g.flagsAgg[c.name] ? 'active' : ''}" title="${c.name}">${i+1}</span>`).join('')}
          </div>
        </td>
        <td class="summary-cell"><span class="truncate">${r['Summary'] || ''}</span></td>
      </tr>`;
      if (expandedRow === idx){
        const sortedAttempts = [...g.attempts].sort((a,b) => {
          const rd = riskRank(b.__risk) - riskRank(a.__risk);
          return rd !== 0 ? rd : b.__score - a.__score;
        });
        tableHtml += `<tr class="detail-row"><td colspan="${cols.length+2}">`;
        if (sortedAttempts.length > 1){
          tableHtml += `<div class="attempts-label">${sortedAttempts.length} call attempts for this shipment, highest risk first</div>`;
        }
        sortedAttempts.forEach(a => {
          tableHtml += `<div class="attempt-block">`;
          if (sortedAttempts.length > 1){
            tableHtml += `<div class="attempt-head">
              <span class="risk-badge ${riskClass(a.__risk)}">${a.__risk}</span>
              <span class="score-num mono">${a.__score}</span>
              <div class="flags">${categories.map((c,i) => `<span class="flag ${a.__flags[c.name] ? 'active' : ''}" title="${c.name}">${i+1}</span>`).join('')}</div>
            </div>`;
          }
          tableHtml += `<div class="detail-grid">
            ${categories.map((c,i) => [c,i]).filter(([c]) => a.__flags[c.name] || Number(a[c.confCol]) > 0).map(([c,i]) => `
              <div class="detail-item">
                <h4><span class="flag active" style="width:16px;height:16px;font-size:9px;">${i+1}</span>${c.name} &middot; ${a[c.confCol]}%</h4>
                <p>${c.evCol ? (a[c.evCol] || 'None') : ''}</p>
              </div>
            `).join('')}
          </div>
          <div class="detail-summary"><strong>Summary</strong>${a['Summary'] || ''}</div>
          </div>`;
        });
        tableHtml += `</td></tr>`;
      }
    });
  }
  tableHtml += `</tbody></table></div>`;

  const paginationHtml = totalItems > 0 ? `
    <div class="pagination">
      <span>${pageStart+1}\u2013${Math.min(pageStart+PAGE_SIZE, totalItems)} of ${totalItems} shipments</span>
      <div class="pagination-controls">
        <button class="page-btn" id="prevPageBtn" ${currentPage<=1?'disabled':''}>Previous</button>
        <span class="page-indicator">Page ${currentPage} of ${totalPages}</span>
        <button class="page-btn" id="nextPageBtn" ${currentPage>=totalPages?'disabled':''}>Next</button>
      </div>
    </div>
  ` : '';
  tableHtml += paginationHtml;

  mainEl.innerHTML = (rawRows.length ? '' : emptyState.outerHTML) + toolbarHtml + (rawRows.length ? tableHtml + renderAnalyticsSection() : '');

  if (rawRows.length){
    document.getElementById('searchInput').addEventListener('input', (e) => { search = e.target.value; expandedRow = null; currentPage = 1; render(); });
    document.getElementById('riskSelect').addEventListener('change', (e) => { riskFilter = e.target.value; expandedRow = null; currentPage = 1; render(); });
    if (inputLoaded){
      document.getElementById('sellerTypeSelect').addEventListener('change', (e) => { extraFilters.seller_type = e.target.value; expandedRow = null; currentPage = 1; render(); });
      document.getElementById('rtoReasonSelect').addEventListener('change', (e) => { extraFilters.rto_reason = e.target.value; expandedRow = null; currentPage = 1; render(); });
      document.getElementById('geoSelect').addEventListener('change', (e) => { extraFilters.geo_distance_bucket = e.target.value; expandedRow = null; currentPage = 1; render(); });
    }
    document.getElementById('scoreMinInput').addEventListener('change', (e) => { scoreMin = Number(e.target.value)||0; currentPage = 1; render(); });
    document.getElementById('scoreMaxInput').addEventListener('change', (e) => { scoreMax = Number(e.target.value)||100; currentPage = 1; render(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      search=''; riskFilter=''; scoreMin=0; scoreMax=100; expandedRow=null; currentPage=1;
      extraFilters = {seller_type:'', rto_reason:'', geo_distance_bucket:''};
      categories.forEach(c => catFilterState[c.name] = 'any');
      render();
    });
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const cat = chip.dataset.cat;
        const cur = catFilterState[cat];
        catFilterState[cat] = cur === 'any' ? 'yes' : (cur === 'yes' ? 'no' : 'any');
        expandedRow = null;
        currentPage = 1;
        render();
      });
    });
    document.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey === key){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
        else { sortKey = key; sortDir = key === 'Overall Score' ? 'desc' : 'asc'; }
        currentPage = 1;
        render();
      });
    });
    document.querySelectorAll('tr.row').forEach(tr => {
      tr.addEventListener('click', () => {
        const idx = Number(tr.dataset.idx);
        expandedRow = expandedRow === idx ? null : idx;
        render();
      });
    });
    const prevBtn = document.getElementById('prevPageBtn');
    const nextBtn = document.getElementById('nextPageBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => { if (currentPage > 1){ currentPage--; expandedRow = null; render(); } });
    if (nextBtn) nextBtn.addEventListener('click', () => { if (currentPage < totalPages){ currentPage++; expandedRow = null; render(); } });
  }
}
</script>
</body>
</html>
